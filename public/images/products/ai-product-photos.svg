<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C4DFF"/><stop offset=".55" stop-color="#4A2FD6"/><stop offset="1" stop-color="#0B0B14"/></linearGradient>
<linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00D1FF"/><stop offset="1" stop-color="#0090FF"/></linearGradient>
<linearGradient id="studio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#6C4DFF"/><stop offset="1" stop-color="#00D1FF"/></linearGradient>
