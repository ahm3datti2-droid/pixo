<radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0B14" flood-opacity="0.35"/></filter>
</defs>
<rect width="1200" height="750" fill="url(#bg)"/>
